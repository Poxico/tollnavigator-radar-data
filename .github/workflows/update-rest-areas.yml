name: Compare TollNavigator MOP database with GDDKiA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-rest-areas.yml'
      - 'scripts/compare_gddkia_mop_database.py'
      - 'scripts/compare_gddkia_mop_database_v2.py'

permissions:
  contents: write

concurrency:
  group: tollnavigator-gddkia-mop-comparison
  cancel-in-progress: true

jobs:
  compare-gddkia-mop-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 openpyxl

      - name: Build and compare safe GDDKiA candidate
        run: |
          mkdir -p tmp data
          python scripts/compare_gddkia_mop_database_v2.py \
            --previous public/tollnavigator/rest_areas.json \
            --xlsx tmp/gddkia_mop_current.xlsx \
            --candidate tmp/rest_areas_gddkia_candidate.json \
            --report data/gddkia_mop_comparison.json \
            --summary tmp/gddkia_mop_comparison.md
          cat tmp/gddkia_mop_comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workbook, candidate and comparison
        uses: actions/upload-artifact@v4
        with:
          name: gddkia-mop-safe-comparison
          path: |
            tmp/gddkia_mop_current.xlsx
            tmp/rest_areas_gddkia_candidate.json
            tmp/gddkia_mop_comparison.md
            data/gddkia_mop_comparison.json
          retention-days: 14

      - name: Commit diagnostic comparison report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gddkia_mop_comparison.json
          if git diff --cached --quiet; then
            echo 'GDDKiA comparison report has not changed.'
          else
            git commit -m 'Update GDDKiA MOP database comparison'
            git push
          fi

      - name: Confirm production database was not modified
        run: |
          if ! git diff --quiet HEAD -- public/tollnavigator/rest_areas.json; then
            echo 'Production MOP database was unexpectedly modified.'
            exit 1
          fi
          echo 'Production MOP database remains unchanged.'
