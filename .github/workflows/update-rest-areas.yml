name: Diagnose TollNavigator rest areas from OSM (manual only)

# OSM is not the authoritative TollNavigator MOP source. The production database
# comes from GDDKiA data and this workflow may only be started manually for
# auxiliary comparison. It must never overwrite the production MOP database.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Ta sama kolejka co w workflow radarów — publikacje Pages nie mogą się nałożyć.
concurrency:
  group: tollnavigator-pages
  cancel-in-progress: false

jobs:
  update-rest-areas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # OSM jest wyłącznie źródłem diagnostycznym; aktualizacja produkcji jest zablokowana.
      MOP_APPLY_UPDATES: 'false'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests

      - name: Restore verified updater tools and safe baseline
        run: |
          set -euo pipefail
          mkdir -p tmp/updater public/tollnavigator

          CHUNK_COUNT=$(find data -maxdepth 1 -type f -name 'rest_areas_bundle_chunk_*' | wc -l)
          if [ "$CHUNK_COUNT" -ne 15 ]; then
            echo "Expected 15 MOP updater chunks, found $CHUNK_COUNT."
            exit 1
          fi

          cat data/rest_areas_bundle_chunk_* | base64 --decode > tmp/rest_areas_updater.zip
          echo 'ceace4c1a3bee71da284acdbd813de85390b11a02aa285ab0576751a68d7b759  tmp/rest_areas_updater.zip' | sha256sum -c -
          unzip -tq tmp/rest_areas_updater.zip
          unzip -q tmp/rest_areas_updater.zip -d tmp/updater
          touch public/.nojekyll

          if [ ! -f public/tollnavigator/rest_areas.json ]; then
            echo 'No published MOP database yet; restoring bundled safe baseline.'
            gzip -dc tmp/updater/data/rest_areas_baseline.json.gz > public/tollnavigator/rest_areas.json
          fi

      - name: Enable manual diagnostic run
        id: due
        run: |
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo 'reason=manual OSM diagnostic only' >> "$GITHUB_OUTPUT"

      - name: Preserve previous safe database
        run: cp public/tollnavigator/rest_areas.json tmp/rest_areas_previous.json

      - name: Fetch and normalize fresh rest areas from OSM
        id: fetch
        shell: bash
        run: |
          set +e
          python scripts/fetch_rest_areas_payload_tiled.py \
            --output tmp/rest_areas_osm_payload.json \
            --diagnostics tmp/rest_areas_tile_diagnostics.json \
            2>&1 | tee tmp/rest_areas_fetch.log
          FETCH_CODE=${PIPESTATUS[0]}

          PARSER_CODE=1
          if [ "$FETCH_CODE" -eq 0 ]; then
            python scripts/normalize_rest_areas_osm.py \
              --input tmp/rest_areas_osm_payload.json \
              --output tmp/rest_areas_fresh.json \
              --diagnostics tmp/rest_areas_normalize_diagnostics.json \
              --min-count 100 \
              2>&1 | tee -a tmp/rest_areas_fetch.log
            PARSER_CODE=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$FETCH_CODE" -eq 0 ] && [ "$PARSER_CODE" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            echo 'OSM candidate set built successfully. Production database remains unchanged.'
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo "OSM diagnostic failed (fetch=$FETCH_CODE, parser=$PARSER_CODE). Production MOP database remains unchanged."
          fi

      - name: Generate detailed MOP diagnostic report
        if: always()
        run: |
          python scripts/report_rest_areas.py \
            --previous tmp/rest_areas_previous.json \
            --fresh tmp/rest_areas_fresh.json \
            --current public/tollnavigator/rest_areas.json \
            --raw-osm tmp/rest_areas_osm_payload.json \
            --fetch-ok "${{ steps.fetch.outputs.ok }}" \
            --output public/tollnavigator/rest_areas_report.json

      - name: Upload OSM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-areas-osm-diagnostics
          path: |
            tmp/rest_areas_fetch.log
            tmp/rest_areas_tile_diagnostics.json
            tmp/rest_areas_normalize_diagnostics.json
            tmp/rest_areas_osm_payload.json
            tmp/rest_areas_fresh.json
            public/tollnavigator/rest_areas_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit diagnostic report only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/tollnavigator/rest_areas_report.json public/.nojekyll

          if git diff --cached --quiet; then
            echo 'No MOP diagnostic report changes to commit.'
          else
            git commit -m 'Update TollNavigator MOP diagnostic report'
            git push
          fi

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark unsuccessful OSM diagnostic
        if: always() && steps.fetch.outputs.ok != 'true'
        run: |
          echo 'The production GDDKiA-derived MOP database was preserved; the optional OSM diagnostic was unsuccessful.'
          exit 1
