name: Inspect TollNavigator GDDKiA MOP source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-rest-areas.yml'
      - 'scripts/inspect_gddkia_mop_xlsx.py'

permissions:
  contents: write

concurrency:
  group: tollnavigator-gddkia-mop-inspection
  cancel-in-progress: true

jobs:
  inspect-gddkia-mop-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 openpyxl

      - name: Download and inspect official GDDKiA workbook
        run: |
          mkdir -p tmp data
          python scripts/inspect_gddkia_mop_xlsx.py \
            --xlsx tmp/gddkia_mop_current.xlsx \
            --output data/gddkia_mop_structure.json \
            --summary tmp/gddkia_mop_summary.md
          cat tmp/gddkia_mop_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workbook and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: gddkia-mop-source-inspection
          path: |
            tmp/gddkia_mop_current.xlsx
            tmp/gddkia_mop_summary.md
            data/gddkia_mop_structure.json
          retention-days: 14

      - name: Commit inspection report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gddkia_mop_structure.json
          if git diff --cached --quiet; then
            echo 'GDDKiA workbook structure has not changed.'
          else
            git commit -m 'Update GDDKiA MOP workbook inspection'
            git push
          fi
